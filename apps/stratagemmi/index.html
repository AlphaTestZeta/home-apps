<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Stratagemmi</title>
  <meta name="theme-color" content="#0a0a0a">
  <link rel="manifest" href="../../manifest.webmanifest">
  <link rel="apple-touch-icon" href="../../pwa/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Stratagemmi">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="back" href="../../index.html" aria-label="Torna alla home">&#8249;</a>

  <!-- Linea in alto: azzera la sequenza -->
  <button id="reset" class="reset" aria-label="Azzera la sequenza"></button>

  <!-- Freccia mostrata a ogni swipe -->
  <svg id="arrow" class="arrow" viewBox="0 0 100 100" aria-hidden="true">
    <path d="M50 8 L92 52 H64 V92 H36 V52 H8 Z" fill="currentColor"/>
  </svg>

  <!-- Stratagemma attivato: resta finché non si tocca lo schermo -->
  <div id="result" class="result" hidden></div>

  <!-- Sequenza inserita finora -->
  <div id="seq" class="seq" aria-live="polite"></div>

  <script src="stratagems.js"></script>
  <script src="app.js"></script>
</body>
</html>
